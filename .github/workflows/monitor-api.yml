name: Monitor da API

# Verifica a API a cada 15 minutos. Se falhar, o GitHub manda e-mail
# para quem estiver "watching" o repositório (Settings > Notifications).
#
# Bônus: o ping também evita que o Render free durma — o que reduz o
# cold start de ~1 min. Isso NÃO substitui o plano pago: quando a
# instância gratuita for a pago, este monitor continua útil do mesmo jeito.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Health check
        run: |
          URL="https://marina-agili.onrender.com/"
          for tentativa in 1 2 3; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$URL" || echo "000")
            echo "tentativa $tentativa: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "✅ API respondendo"
              exit 0
            fi
            sleep 20
          done
          echo "❌ API fora do ar após 3 tentativas (último código: $CODE)"
          exit 1

      - name: Serviços carregando (prova que o banco respondeu)
        run: |
          BODY=$(curl -s --max-time 60 "https://marina-agili.onrender.com/api/servicos")
          echo "resposta: $BODY"
          echo "$BODY" | grep -q '\['
          echo "✅ Lista de serviços OK"
